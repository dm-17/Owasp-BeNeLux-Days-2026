    bio     : >-
              Nariman Aga-Tagiyev is an Application Security Architect with over two 
              decades of experience in software development. Throughout his career, Nariman 
              has worn many hats, serving as a developer, software architect, DevSecOps 
              engineer, and cloud architect.<br />
              <br />
              Since 2016, however, he has focused exclusively on Application Security and 
              advancing the maturity of the Software Security Development Lifecycle (SSDLC). 
              He has led the development of AppSec programs for international corporations, 
              including initiatives in software supply chain security, Threat modeling, and 
              Security Champions programs.<br />
              <br />
              Nariman is a core team member of the OWASP SAMM (Software Assurance Maturity 
              Model) project and holds the ISC2 Certified Secure Software Lifecycle 
              Professional (CSSLP) certification.
    title   : Preparing for the EU Cyber Resilience Act with OWASP SAMM
    abstract: >-
              This full-day, interactive workshop provides a detailed understanding of the 
              EU Cyber Resilience Act (CRA) and its implications for organizations producing 
              products with digital and software components. We will deep dive into how OWASP 
              SAMM (Software Assurance Maturity Model) can help your organization get ready 
              for it. We will explore the CRA’s key requirements - including its timeline, 
              affected product categories, impact on Open Source Software, financial penalties, 
              and expected application security activities. You’ll gain a clear understanding 
              of how SAMM maps to CRA obligations and how it can serve as a practical foundation 
              for compliance and continuous improvement.<br />
              <br />
              Through interactive exercises and group discussions, participants will learn how to 
              perform SAMM assessments, address organizational and cultural challenges, and 
              prioritize improvements based on company context. We’ll dive deep into SAMM’s 
              activities, discuss success criteria&#39;s, and connect it with related frameworks 
              such as DSOMM and AI Maturity. By the end of the day, you’ll walk away with a clear 
              set of next steps to elevate your application security maturity and prepare 
              effectively for the EU CRA.
