    name    : Jeroen Beckers
    bio     : >-
              I am the mobile solution lead at NVISO, where I am responsible for quality 
              delivery, innovation and methodology for all mobile assessments. I am 
              actively involved in the mobile security community, and I try to share my 
              knowledge through open-source tools, blogposts, trainings and presentations. 
              I am the lead author and instructor of the SANS 575 course&#58; Mobile device 
              security and ethical hacking and a co-author of the OWASP Mobile Application 
              Security Testing Guide (MSTG) and OWASP Mobile Application Security 
              Verification Standard (MASVS).
    title   : The Hitchhacker's guide to the mobile galaxy workshop
    abstract: >-
              The mobile galaxy is dominated by two solar systems&#58;&#58; Android and iOS. 
              Grab your towel and embark on a journey through the intricacies of mobile 
              operating systems. Uncover the secrets and vulnerabilities of mobile app planets 
              through static analysis. Ignite the infinite improbability drive and delve deeper 
              with dynamic analysis to gain the skills and knowledge to outwit the Vogons.
              <br />
              In this training, not only the Ultimate Question of Life, the Universe, and 
              Everything will be answered but also most of your questions regarding mobile 
              security. Join us on this galactic adventure of exploring the OWASP MASVS and MASTG!    
