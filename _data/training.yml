              organizations to securely and reliably leverage LLM technology.
              <br /><br />Tim Van hamme is a computer scientist specialized in AI security and behavioral analysis, 
              leading research at KU Leuven's DistriNet on secure and trustworthy AI adoption. 
              As co-lead of Blue41, he bridges rigorous academic research with industry applications, 
              helping organizations safely deploy AI systems. With experience spanning from CERT.be's 
              threat intelligence infrastructure to behavioral biometrics and AI agent security, 
              Tim combines theoretical expertise with practical solutions for emergent AI security challenges.
    title   : Hacking AI Guardrails Workshop (LISA)
    abstract: >-
              In this workshop, participants will get hands-on experience both building and breaking 
              AI guardrails. Working in teams, you’ll design guardrail policies to defend sensitive 
              data within a vulnerable AI application, while attempting to bypass those of others. 
              Who will win? The scoreboard will tell, but in the end everyone walks away with a 
              deeper grasp of how LLMs can be manipulated and the challenges of building robust guardrails.
              <br />This workshop is delivered as part of the VLAIO research project LISA.
