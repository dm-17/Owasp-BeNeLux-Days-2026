  - type    : talk
    image   : jeroen_beckers.png
    day     : 26/11/2026
    time    : 00:00 - 00:00
    name    : Jeroen Beckers
    bio     : >-
              I am the mobile solution lead at NVISO, where I am responsible for quality 
              delivery, innovation and methodology for all mobile assessments. I am 
              actively involved in the mobile security community, and I try to share my 
              knowledge through open-source tools, blogposts, trainings and presentations. 
              I am the lead author and instructor of the SANS 575 course&#58; Mobile device 
              security and ethical hacking and a co-author of the OWASP Mobile Application 
              Security Testing Guide (MSTG) and OWASP Mobile Application Security 
              Verification Standard (MASVS).
    title   : New phone, who dis? - Malware. It's malware.
    abstract: >-
              Supply-chain attacks have taken down major corporations before. But they 
              don’t only happen to businesses. Sometimes, they’re much more personal. 
              What if your brand-new device was compromised from the start, with malware 
              so deeply embedded that even a factory reset couldn’t remove it? In this 
              talk, we will take a look at Triada&#58; malware that doesn’t just infect 
              your phone, but becomes part of the operating system itself. Tracking and 
              attacking you from the moment you turn it on, impossible to remove. What 
              does it actually do? Would you even notice? Join me in this talk to find out!
