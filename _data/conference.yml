  - type    : talk
    image   : Vera-Rim.jpg
    day     : 26/11/2026
    time    : 16:20 - 17:05
    name    : Vera Rimmer
    bio     : >-
              Dr. Vera Rimmer is a research expert at the DistriNet research group at 
              KU Leuven, where she conducts and leads research activities in the 
              intersection of security, privacy and AI. Her doctorate focused on applying 
              deep learning in anonymity networks and network defense systems. Currently, 
              Vera and her team explore data analytics in network intrusion and malware 
              detection and analysis, and trustworthiness of AI in the wider ICT context. 
              Vera is interested in developing comprehensive understanding, reasonable 
              expectations and mitigation of risks of AI in the age of uncontrolled data 
              collection and inference.
    title   : Closing Keynote - Navigating the Security Landscape of Modern AI&#58; Promises and Pitfalls
    abstract: >-
              The fast-evolving ecosystem of AI-enabled applications has exposed a complex 
              interplay of vulnerabilities, some stemming from intrinsic pitfalls of 
              data-driven AI and others arising from its unsafe integration into real-world 
              applications. Integrating AI inevitably increases the threat landscape of a 
              system, but the exact implications can be hard to predict. The goal of this 
              talk is to raise awareness about the underlying principles and challenges of 
              security and privacy of modern AI systems, including LLMs, and to review the 
              ongoing mitigation efforts by both academic and industry players.
