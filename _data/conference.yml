  - type    : talk
    image   : Efthymios-Lalas.png
    day     : 26/11/2026
    time    : 10:00 - 10:40
    name    : Efthymios Lalas
    bio     : >-
              Efthymios has been with the European Commission in Luxembourg since 2014 and is 
              currently Deputy Head of the Cybersecurity Policy Implementation Unit at DG DIGIT. 
              He leads, among other initiatives, the definition and implementation of the 
              Corporate Cybersecurity Strategy 2026–2026 and chairs both internal and 
              interinstitutional working groups on Cybersecurity for Artificial Intelligence.<br />
              <br />
              Previously at DG DIGIT, he headed the Security Assurance sector, overseeing security 
              testing and vulnerability management, and earlier worked in the incident response team, 
              coordinating the Commission’s response to cybersecurity incidents.<br />
              <br />
              He recently completed a Master’s in Artificial Intelligence for Public Services (AI4GOV) 
              and also holds degrees in Computer Engineering & Informatics (five-year Diploma equivalent 
              to a Master’s in Engineering), Digital Systems Security (MSc), and Business Administration 
              & Management (BSc). In addition, he has pursued executive education programs in leadership, 
              strategic management, and people development, and holds numerous professional certifications 
              in the field of cybersecurity.
    title   : AI Security Frameworks&#58; Insights from the European Commission&#39;s Journey
    abstract: >-
              Artificial Intelligence (AI) technologies are impacting individuals and organisations, 
              transforming the way we work. At the same time, threats related to the use of AI systems are 
              evolving at the same pace. As stated in ENISA Threat Landscape Report 2026, the increased 
              integration of AI systems into enterprise environments introduces a potentially vulnerable 
              new attack surface.<br />
              <br />
              This talk provides an inside look at the Commission’s journey in evaluating and selecting AI 
              security frameworks, focusing on why the OWASP AI Top 10 was chosen as a reference point.
