  - type    : talk
    image   : robbe_van_roey.png
    day     : 26/11/2026
    time    : 00:00 - 00:00
    name    : Robbe Van Roey
    bio     : >-
              Hi! I’m Robbe Van Roey.<br />
              I’m a hacker. I like breaking stuff. I’m a security researcher at Aikido, I’ve 
              worked for a bug bounty company, and I’ve found 35+ CVEs. I love hacking web apps, 
              mobile applications, AI systems, and Active Directory.<br />
              I’m also a teacher. I teach developers about secure coding, I teach beginners about 
              Red Teaming for Hack The Box and I’ve created a bunch of YouTube videos on my 
              channel.<br />
              In the online realm, you may know me as PinkDraconian. Come up to me and say hi!
    title   : Hacking Browsers&#58; The Easy Way
    abstract: >-
              When you think of hacking browsers, you perhaps think of V8 heap exploitation, 
              deep-dive fuzzing, crazy sandbox escapes, and so on. But what if I told you that 
              you can still find vulnerabilities in major browsers that don’t require any technical 
              knowledge? Bugs you can even run into by accident!<br />
              In this talk, I’ll take you through my journey of how I “accidentally“ found a 
              vulnerability in Google Chrome. And how that led me to find more vulnerabilities in 
              Chrome as well as some vulnerabilities in Mozilla Firefox and many more bugs in other 
              products.<br />
              So if you’re keen to find out how I could, with minimal user-interaction, steal your 
              private GitHub repositories, then this talk is for you!
