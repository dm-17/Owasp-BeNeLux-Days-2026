  - type    : talk
    image   : katie_paxton.jpg
    day     : 26/11/2026
    time    : 00:00 - 00:00
    name    : Katie Paxton-Fear
    bio     : >-
              Katie Paxton-Fear is a hacker and security advocate at Semgrep – she used to make 
              applications, and now she breaks them. She got her start hacking participating in 
              bug bounty programs. She spends her time making YouTube videos teaching other people 
              how to hack APIs and web apps. Her content has been recommended by threat actors and 
              professionals alike. 
    title   : I was a certified AI hater, and now I use it every day
    abstract: >-
              In my past life I was an AI hater, I'd seen the slop reports, the fake findings, the 
              keynotes, the vendor pitches, and I was done with AI. Then I got hit by a truck&#58; 
              my bosses-bosses-boss asking me to help with 81 AI generated findings. I woke up in 
              a world where they weren't slop? But actually genuine security issues? From the bot? 
              I was just an ordinary hacker, but now I'm paying Anthropic for a Claude Max 
              subscription. I'm now building my own AI tooling, benchmarking models, and advocating 
              for open weight AI, here's how I got there and how you can start to build your own AI 
              tools to support your work.
