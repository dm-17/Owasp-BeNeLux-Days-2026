  - type    : talk
    image   : Aram-Hovsepyan.jpg
    day     : 26/11/2026
    time    : 13:40 - 14:20
    name    : Aram Hovsepyan
    bio     : >-
              Aram is the founder and the CEO of Codific. With over 15 years of application security 
              experience, he has a proven track record in building complex software systems by 
              explicitly focusing on quality.<br />
              <br />
              Aram has a PhD in cybersecurity from DistriNet KU Leuven. His contributions to the 
              refinement and streamlining of the LINDDUN privacy engineering methodology have been 
              incorporated into ISO and NIST standards.<br />
              <br />
              Aram is also a core contributor to the OWASP SAMM project.
    title   : Your Security Dashboard is Lying to You&#58; The Science of Metrics
    abstract: >-
              Security teams love metrics. Beautiful dashboards, filled with vulnerability counts, 
              alert volumes, SLA compliance for fix times, training hours logged, etc. However, do any 
              of these metrics actually make organizations more secure? The uncomfortable truth is 
              that most security metrics are questionable, at least from a scientific perspective.<br />
              <br />
              In this talk, I will focus on the science behind meaningful security metrics. I will 
              introduce a framework that helps define metrics based on organization-specific goals, as 
              opposed to creating purpose around whatever metrics we have lying around. From there, I 
              will break down what are the key qualities of a good metric. Finally, I will briefly 
              present the different data analysis methods and the common validity threats when going 
              from metric values back to supporting your goals.<br />
              <br />
              &#34;If you can&#39;t measure it, you can&#39;t improve it&#34;. However, if your security strategy is 
              built on questionable metrics, you might not be improving the right things. This talk 
              will challenge industry assumptions and provide scientific backing to the fact that many 
              widely used security metrics in the industry might be vanity numbers.
