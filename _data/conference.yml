  - type    : talk
    image   : Olle-E-Johansson.jpg
    day     : 26/11/2026
    time    : 12:00 - 12:40
    name    : Olle E Johansson
    bio     : >- 
              Olle E. Johansson has over twenty years of experience in telecommunications, VoIP, and 
              cybersecurity. Olle is active in open-source projects and standard forums, the founder 
              of major appsec and network security initiatives, and a specialist for various categories 
              of software bills of materials (SBOM). These days, SBOMs are everywhere, but not every 
              SBOM use is equally successful. Olle will tell us how to improve their application, how to 
              work with them day in and day out and how to develop your own SBOM lifestyle for your 
              organization.
    title   : The SBOM and the Software Security Regulation Revolution
    abstract: >-
              The society has given up on letting the IT industry handle cyber security by itself. The 
              cost for society is going up, the number of incidents is rising all the time. The regulators 
              are moving in across the globe, and we’re getting regulated. At the heart of many regulations 
              is vulnerability management—keeping products secure during the lifetime in use. Olle will go 
              through how it’s planned to work and the sad smelly truth about the state of the 
              vulnerability management platforms today. From Software bill of materials over vulnerability 
              databases to EU regulation. The main question in all of this is&#58; Are you ready to be 
              regulated?
