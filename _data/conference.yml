  - type    : talk
    image   : marc_samson.jpg
    day     : 26/11/2026
    time    : 00:00 - 00:00
    name    : Marc Samson
    bio     : >-
              Marc Samson is an internationally experienced Cybersecurity, IT/OT, AI and Privacy 
              executive with over 20 years of experience. He has helped multinational corporations 
              and government agencies across Europe, the Americas, and the Caribbean strengthen 
              resilience through pragmatic, business-aligned security programs.<br />
              His work spans governance, risk management, critical infrastructure protection, and 
              OT security, with a strong focus on turning security investments into measurable 
              business value.<br />
              Marc is Director of Research and an advisory board member at ISACA Belgium, and Country 
              Coordinator for Belgium at CCI (Centro de Ciberseguridad Industrial / the Industrial 
              Cybersecurity Center). He regularly speaks at international conferences, where he bridges 
              technical depth with strategic clarity for executives.<br >
              Passionate about building digital trust and enabling secure innovation, he helps 
              organizations protect the technologies that underpin modern society.
    title   : Your PLC won’t get a hotfix&#58; security for systems you can’t change 
    abstract: >-
              A web developer who finds an injection flaw ships a fix within days. In a plant, the 
              same flaw can sit in a controller for ten years&#58; the vendor certifies one firmware 
              version, the process stops only during the annual turnaround, and nobody may install an 
              agent on the engineering workstation. Meanwhile, browser-based HMIs, historians with REST 
              APIs and remote-maintenance connectors are bringing familiar vulnerabilities onto the 
              factory floor.<br />
              <br />
              Drawing on twenty years in industrial and critical infrastructure environments, this talk 
              covers what still works when you can’t patch. It then turns to the supply side, where 
              IEC 62443-4-1 and the Cyber Resilience Act now require machine builders to run a secure 
              development lifecycle, publish SBOMs and handle vulnerabilities for decades.
    linkedin: https://www.linkedin.com/in/marcsamsonit/
