  - type    : talk
    image   : Elar-Lang.jpg
    day     : 26/11/2026
    time    : 14:30 - 15:10
    name    : Elar Lang
    bio     : >-
              Elar Lang is a web application security specialist and enthusiast who has been working for 
              more than 13 years in different aspects of web application security. A full-time security 
              tester, training architect, and web application security developer educator (3000 hours of 
              training). Likes to research and write proof-of-concepts for attacks. More than 5 years 
              actively developing and co-leading a security standard - OWASP Application Security 
              Verification Standard (ASVS).
    title   : OWASP ASVS - what is it and what is new in the v5.0 release
    abstract: >-
              The first major release in five years of one of OWASP’s flagship projects - the Application 
              Security Verification Standard (ASVS) version 5 - was announced on the OWASP Global AppSecEU 
              conference on May 30 this year (2026).<br />
              <br />
              In this talk, Elar Lang, as one of the co-leaders and key authors of the concept for the 
              version, introduces the project and points out key aspects from the latest release.<br />
              <br />
              This includes&#58;<br />
              <ul>
              <li>Defining and clarifying the scope of the ASVS, and expectations for requirements.</li>
              <li>Mandating documented security decisions to provide some flexibility on implementing 
              and verifying security requirements, to match the differences between organizations and 
              applications.</li>
              <li>Adding several new chapters, such as token validation, OAuth and OIDC.</li>
              <li>Providing a two-way mapping to make it easier to migrate from v4.x to v5.</li>
              <li>Balancing the levels and reducing the barrier to entry into Level 1.</li>
              <li>The release strategy.</li>
              <li>How you can contribute.</li>
              </ul>
